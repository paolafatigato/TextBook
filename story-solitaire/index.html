<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Solitaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Story <span>Solitaire</span></div>
    <div class="stats" id="stats"></div>
    <div class="actions">
      <button class="btn" data-action="undo" id="undoBtn">↶ Undo</button>
      <button class="btn" data-action="hint">💡 Hint</button>
      <button class="btn" data-action="stories">📖 My stories</button>
      <button class="btn" data-action="again">Deal again</button>
      <button class="btn btn-main" data-action="new">New stories</button>
      <button class="btn" data-action="rules">? Rules</button>
      <button class="btn" data-cls="open" id="clsOpen">👥 Class game</button>
    </div>
  </header>

  <div class="cls-bar" id="classBar" hidden></div>

  <main class="table" id="table">
    <div class="board" id="board"></div>
  </main>

  <div class="msg" id="msg"></div>
  <div class="reader" id="reader"></div>

  <aside class="drawer" id="drawer">
    <button class="btn close" data-action="stories">✕</button>
    <h2>My stories</h2>
    <div id="drawerBody"></div>
  </aside>

  <div class="cls-overlay" id="classBox" hidden></div>
  <div class="modal" id="modal" hidden><div class="modal-box" id="modalBox"></div></div>

  <script src="stories.js"></script>
  <script src="levels.js"></script>
  <script src="classics.js"></script>
  <script src="grammar.js"></script>
  <script src="engine.js"></script>
  <script src="script.js"></script>
  <script src="class.js"></script>
  <script type="module" src="online.js"></script>
</body>
</html>
